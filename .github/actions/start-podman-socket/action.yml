name: start-podman-socket
description: rootless podman の Docker 互換ソケットを起動し DOCKER_HOST を設定する

runs:
  using: composite
  steps:
    - name: resolve XDG_RUNTIME_DIR
      shell: bash
      run: |
        set -euo pipefail
        # GitHub ランナーの bash では XDG_RUNTIME_DIR が未設定のことがある。
        # user systemd セッションが無い場合に備え、無ければ $HOME 配下にフォールバックする。
        dir="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
        if ! mkdir -p "$dir" 2>/dev/null || [ ! -w "$dir" ]; then
          dir="$HOME/.xdg-runtime"
          mkdir -p "$dir"
          chmod 700 "$dir"
        fi
        echo "XDG_RUNTIME_DIR=$dir" >> "$GITHUB_ENV"

    - name: start podman socket
      shell: bash
      run: |
        set -euo pipefail
        sock="${XDG_RUNTIME_DIR}/podman/podman.sock"
        mkdir -p "$(dirname "$sock")"
        # user systemd が使えるとは限らないため、失敗したら podman system service に落とす。
        if systemctl --user enable --now podman.socket 2>/dev/null; then
          echo "socket started via user systemd"
        else
          echo "user systemd unavailable; falling back to 'podman system service'"
          nohup podman system service --time=0 "unix://${sock}" >"${RUNNER_TEMP}/podman-service.log" 2>&1 &
        fi
        for _ in $(seq 1 30); do
          [ -S "$sock" ] && break
          sleep 1
        done
        if [ ! -S "$sock" ]; then
          echo "podman socket did not appear at $sock"
          cat "${RUNNER_TEMP}/podman-service.log" 2>/dev/null || true
          exit 1
        fi
        echo "DOCKER_HOST=unix://${sock}" >> "$GITHUB_ENV"

    - name: podman info
      shell: bash
      run: |
        set -euo pipefail
        podman version
        # rootless で native overlay か fuse-overlayfs か（性能差の要因）を記録する。
        podman info --format 'graphDriverName={{.Store.GraphDriverName}}'
        podman info --format 'mount_program={{index .Store.GraphOptions "overlay.mount_program" "Executable"}}' || true
        podman info --format 'graphRoot={{.Store.GraphRoot}}'
        podman info --format 'imageStores={{.Store.ImageStore}}' || true
