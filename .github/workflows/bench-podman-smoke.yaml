name: bench-podman-smoke

# Phase 1: 性能は測らない。テストが rootless podman 上で通るかだけを確認する。
# ここが通らなければ方式Bは中止。

on:
  workflow_dispatch:

env:
  # Podman 上の Ryuk は不安定なため無効化する。
  # ランナーはジョブ終了で破棄されるのでリソースリークの実害はない。
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # setup-go の既定キャッシュは go.sum ハッシュのみをキーにしており
          # ci.yaml と衝突する。計測系ワークフローからは触らせない。
          cache: false

      - name: assert no explicit network in tests
        run: |
          set -euo pipefail
          # Docker のデフォルトネットワークは bridge、Podman は podman。
          # testcontainers-go が介入するのは明示指定がある場合のみなので、
          # 明示指定が入り込んだ時点で方式Bの前提が崩れる。
          if grep -rn 'Networks:' --include='*.go' .; then
            echo "explicit Networks found; podman network name differs from docker"
            exit 1
          fi
          echo "no explicit Networks"

      - uses: ./.github/actions/start-podman-socket

      - name: go test
        run: go test ./... --race -cover
