name: bench-prepare-cache

# 方式A(docker save tar) と 方式B(podman イメージストア) のキャッシュを作る。
# 計測ワークフローとは分離し、手動 or 週次で実行する。
# 既に同一キーのキャッシュが存在する場合 actions/cache/save は警告を出してスキップする（失敗はしない）。

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

env:
  IMAGE: mysql:8.0.36

jobs:
  docker-tar:
    name: method A / docker save tar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: pull and save
        run: |
          set -euo pipefail
          mkdir -p "$HOME/imgtar"
          docker pull "$IMAGE"
          # -o は無圧縮。actions/cache 側の zstd と二重圧縮にならないようにする。
          docker save "$IMAGE" -o "$HOME/imgtar/mysql.tar"
          ls -l "$HOME/imgtar"
          echo "tar_bytes=$(du -sb "$HOME/imgtar" | cut -f1)"

      - uses: actions/cache/save@v4
        with:
          path: ~/imgtar
          key: bench-docker-tar-${{ hashFiles('.github/image-versions.txt') }}

  podman-store:
    name: method B / podman image store
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: populate additional image store
        run: |
          set -euo pipefail
          mkdir -p "$HOME/imgstore"
          # 計測側の storage.conf と driver を一致させる必要があるため overlay を明示する。
          podman --root "$HOME/imgstore" --storage-driver overlay pull "docker.io/library/${IMAGE}"
          podman --root "$HOME/imgstore" --storage-driver overlay images
          echo "store_bytes=$(du -sb "$HOME/imgstore" | cut -f1)"

      - name: archive store preserving ownership
        run: |
          set -euo pipefail
          # actions/cache は runner 権限で tar するため、rootless podman のストア
          # (sub-UID 所有のファイルを含む) をそのままは保存できない。
          #
          # 所有者を平坦化する方法は破綻した: chown/chmod でアーカイブ可能にはなるが、
          # イメージ内の非 root ユーザー所有ファイルが container-root 所有になり、
          # uid 999 で動く mysqld が読めず起動に失敗する (run 33784022153)。
          #
          # そこで root 権限で tar を作り、所有者を保存したまま持ち回る。
          # actions/cache はこの tar 1 ファイルだけを扱う。
          # 無圧縮にするのは actions/cache 側の zstd と二重圧縮しないため。
          sudo tar -C "$HOME" -cf "$HOME/imgstore.tar" imgstore
          sudo chown "$(id -u):$(id -g)" "$HOME/imgstore.tar"
          echo "archive_bytes=$(stat -c %s "$HOME/imgstore.tar")"

      - uses: actions/cache/save@v4
        with:
          path: ~/imgstore.tar
          key: bench-podman-store-tar-${{ hashFiles('.github/image-versions.txt') }}
