name: bench-prepare-cache

# 方式A(docker save tar) と 方式B(podman イメージストア) のキャッシュを作る。
# 計測ワークフローとは分離し、手動 or 週次で実行する。
# 既に同一キーのキャッシュが存在する場合 actions/cache/save は警告を出してスキップする（失敗はしない）。

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

env:
  IMAGE: mysql:8.0.36

jobs:
  docker-tar:
    name: method A / docker save tar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: pull and save
        run: |
          set -euo pipefail
          mkdir -p "$HOME/imgtar"
          docker pull "$IMAGE"
          # -o は無圧縮。actions/cache 側の zstd と二重圧縮にならないようにする。
          docker save "$IMAGE" -o "$HOME/imgtar/mysql.tar"
          ls -l "$HOME/imgtar"
          echo "tar_bytes=$(du -sb "$HOME/imgtar" | cut -f1)"

      - uses: actions/cache/save@v4
        with:
          path: ~/imgtar
          key: bench-docker-tar-${{ hashFiles('.github/image-versions.txt') }}

  podman-store:
    name: method B / podman image store
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: populate additional image store
        run: |
          set -euo pipefail
          mkdir -p "$HOME/imgstore"
          # 計測側の storage.conf と driver を一致させる必要があるため overlay を明示する。
          podman --root "$HOME/imgstore" --storage-driver overlay pull "docker.io/library/${IMAGE}"
          podman --root "$HOME/imgstore" --storage-driver overlay images
          echo "store_bytes=$(du -sb "$HOME/imgstore" | cut -f1)"

      - name: flatten ownership for actions/cache
        run: |
          set -euo pipefail
          # rootless podman のストアには sub-UID にマップされたファイルが含まれ
          # (イメージ内の mysql:mysql = ホスト上の uid 100998)、runner 権限では読めない。
          # actions/cache は runner 権限で tar するため、そのままだと
          # 「tar: Cannot open: Permission denied」で保存に失敗する。
          # しかも失敗は warning 止まりでジョブは success になるため気づけない。
          #
          # podman unshare chown ではベースイメージ層の /etc/shadow 等が残ったため、
          # ホスト側で直接 chown する。rootless podman では ホスト runner = コンテナ内 uid 0
          # なので、コンテナから見た所有者は root のままになる。
          sudo chown -R "$(id -u):$(id -g)" "$HOME/imgstore"

      - name: assert store is archivable by runner
        run: |
          set -euo pipefail
          # actions/cache の保存失敗は warning 止まりなので、ここで先に落とす。
          # なお tar -cf /dev/null は GNU tar が内容を読まない最適化をするため検証にならない。
          # -type f/-type d に限定するのは、-readable がシンボリックリンクのリンク先を
          # 辿るため、イメージに含まれる壊れたリンク (/usr/lib/.build-id/* など) を
          # 誤検出するのを避けるため。tar はリンク自体を保存するので問題にならない。
          unreadable="$(find "$HOME/imgstore" \( -type f -o -type d \) ! -readable -print -quit)"
          if [ -n "$unreadable" ]; then
            echo "unreadable by $(id -un): $unreadable"
            ls -l "$unreadable" || true
            exit 1
          fi
          echo "all entries readable by $(id -un)"

      - uses: actions/cache/save@v4
        with:
          path: ~/imgstore
          key: bench-podman-store-${{ hashFiles('.github/image-versions.txt') }}
